<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>东北热</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #0b0b0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 主卡片容器 – 模拟图片中的简洁布局 */
        .container {
            background: #14141c;
            border-radius: 28px;
            padding: 48px 56px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.08);
            text-align: center;
            max-width: 700px;
            width: 90%;
            transition: all 0.25s ease;
        }

        /* 品牌标题 – “东北热” */
        .brand {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.6);
            margin-bottom: 32px;
            position: relative;
            display: inline-block;
        }

        .brand::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -10px;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            border-radius: 2px;
        }

        /* 导航列表 – 水平居中 */
        .nav-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 28px;
            margin-top: 16px;
        }

        .nav-list li {
            font-size: 22px;
            font-weight: 600;
            color: #c8c6d4;
            padding: 8px 6px;
            cursor: default;
            transition: color 0.25s, transform 0.2s, text-shadow 0.25s;
            position: relative;
            letter-spacing: 1px;
        }

        /* 悬停效果 – 金色高亮 */
        .nav-list li:hover {
            color: #ffd700;
            transform: translateY(-2px);
            text-shadow: 0 0 18px rgba(255, 215, 0, 0.3);
        }

        /* 每个菜单项底部细线 – 优雅点缀 */
        .nav-list li::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -2px;
            transform: translateX(-50%) scaleX(0);
            width: 70%;
            height: 2px;
            background: #ffd700;
            border-radius: 2px;
            transition: transform 0.3s ease;
        }

        .nav-list li:hover::after {
            transform: translateX(-50%) scaleX(1);
        }

        /* 小屏适配 – 保持可读性 */
        @media (max-width: 480px) {
            .container {
                padding: 32px 20px 28px;
                border-radius: 20px;
            }

            .brand {
                font-size: 38px;
                letter-spacing: 4px;
            }

            .nav-list {
                gap: 10px 18px;
            }

            .nav-list li {
                font-size: 18px;
                padding: 6px 4px;
            }
        }

        /* 极简装饰 – 底部微光 */
        .glow {
            margin-top: 28px;
            font-size: 13px;
            color: rgba(255, 215, 0, 0.2);
            letter-spacing: 2px;
            font-weight: 300;
        }

        .glow span {
            color: rgba(255, 215, 0, 0.35);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 品牌标题 -->
        <div class="brand">东 北 热</div>

        <!-- 导航菜单 – 与图片中的 li 完全对应 -->
        <ul class="nav-list">
            <li>亚洲</li>
            <li>欧美</li>
            <li>日韩</li>
            <li>短视频</li>
            <li>游戏-紧急修复</li>
            <li>小说100%</li>
        </ul>

        <!-- 可选装饰 – 保留图片之外的氛围，但可忽略 -->
        <div class="glow">✦ <span>·</span> 热度持续 <span>·</span> ✦</div>
    </div>

</body>
</html>
